name: ci

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Force the Docker daemon on the runner to switch to Windows Container mode
      - name: Switch to Windows Containers
        run: |
          & "C:\Program Files\Docker\Docker\DockerCli.exe" -SwitchDaemon
        shell: powershell

      # 2. Log in directly using standard PowerShell / Docker CLI to avoid action mismatches
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
        shell: powershell

      # 3. Natively compile and push the Windows image
      - name: Build and push Windows container
        run: |
          docker build --no-cache -t hammadrauf/saltmw:latest .
          docker push hammadrauf/saltmw:latest
        shell: powershell
