name: ci

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Ensure the Windows Docker engine service is actually running
      - name: Verify and Start Docker Service
        run: |
          Get-Service docker | Start-Service -ErrorAction SilentlyContinue
          docker version
        shell: powershell

      # 2. Log in directly using standard PowerShell
      - name: Login to Docker Hub
        run: |
          [System.Console]::Write("${{ secrets.DOCKERHUB_TOKEN }}") | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
        shell: powershell


      # 3. Natively compile and push using the default Windows engine
      - name: Build and push Windows container
        run: |
          docker build --no-cache -t hammadrauf/saltmw:latest .
          docker push hammadrauf/saltmw:latest
        shell: powershell
