name: ci

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and Start Docker Service
        run: |
          Get-Service docker | Start-Service -ErrorAction SilentlyContinue
          docker version
        shell: powershell

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Windows container
        run: |
          docker build --no-cache -t hammadrauf/saltmw:latest .
          docker push hammadrauf/saltmw:latest
        shell: powershell
